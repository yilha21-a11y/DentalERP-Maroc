name: Validate DentalERP Maroc Web

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/dentalerp
      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/dentalerp
      - name: Type check
        run: npx tsc --noEmit
      - name: Security regression tests
        run: npx vitest run tests/unit/patient-auth.test.ts tests/unit/cron-auth.test.ts
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/dentalerp
          NEXTAUTH_SECRET: validation-secret-validation-secret
          PATIENT_JWT_SECRET: validation-patient-secret-validation-patient-secret
          WAITING_ROOM_DISPLAY_SECRET: validation-waiting-room-secret-validation-waiting-room
          NEXTAUTH_URL: http://localhost:3000
