name: Validate DentalERP Maroc Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Compile Android debug app
        run: gradle -p android :app:assembleDebug --stacktrace
