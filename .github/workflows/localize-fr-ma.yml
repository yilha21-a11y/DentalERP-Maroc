name: Localize French Morocco

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'scripts/localize-fr-ma.mjs'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply controlled UI localization
        run: node scripts/localize-fr-ma.mjs
      - name: Commit localized UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components
          git diff --cached --quiet || git commit -m 'Apply French Morocco UI localization'
          git push origin develop
