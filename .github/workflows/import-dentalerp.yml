name: Import DentalERP upstream

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-dentalerp.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone DentalERP source
        run: |
          git clone --depth 1 https://github.com/abinauv/dental-erp.git /tmp/dental-erp
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            /tmp/dental-erp/ ./

      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import DentalERP upstream source' || exit 0
          git push
