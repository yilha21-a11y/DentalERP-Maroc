name: Apply French Morocco to develop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fr-ma-develop.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply localization
        run: node scripts/localize-fr-ma.mjs
      - name: Commit changes to develop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components
          git diff --cached --quiet || git commit -m 'Apply French Morocco UI localization'
          git push origin develop
